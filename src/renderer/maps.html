<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
<title>Cartes workshop</title>
<style>
  @font-face { font-family:'Barlow Condensed'; font-weight:700; font-style:normal;
    src:url('fonts/barlow-condensed-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family:'Barlow Condensed'; font-weight:800; font-style:normal;
    src:url('fonts/barlow-condensed-latin-800-normal.woff2') format('woff2'); }
  @font-face { font-family:'Barlow Condensed'; font-weight:800; font-style:italic;
    src:url('fonts/barlow-condensed-latin-800-italic.woff2') format('woff2'); }

  /* Même palette et mêmes ingrédients que la fenêtre de contrôle : la
     fenêtre Cartes appartient à l'application, elle suit l'habillage et les
     couleurs choisis (applyTheme ci-dessous, skins.css). */
  :root {
    --bg:#0c0e11; --panel:#171b22; --panel2:#1f242d; --line:#39414f;
    --text:#e3e8ef; --muted:#8b93a1;
    --blue:#4dabff; --blue-deep:#1466b8;
    --orange:#e0741a; --orange-deep:#a34f00;
    --gold:#ffc233;
    /* Même rouge d'erreur que la fenêtre de contrôle, hors thème : un fichier
       disparu doit se voir quelle que soit la couleur « défaite » choisie. */
    --red:#ff4d5e;
    --blue-soft:color-mix(in srgb, var(--blue) 12%, transparent);
    --text-ghost:color-mix(in srgb, var(--text) 4%, transparent);
    --edge:rgba(0, 0, 0, .62);
    --ui-font:'Barlow Condensed','Segoe UI',sans-serif;
    --num-style:italic;
    --cut:18px; --cut-sm:12px; --skew:-14deg; --dens:1;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  /* Contour de focus franc, repris de la fenêtre de contrôle (audit 001). */
  :focus-visible { outline:2px solid var(--blue); outline-offset:2px; }

  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Segoe UI',ui-sans-serif,system-ui,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  .cond { font-family:var(--ui-font); }

  /* ─── Emplacement : LE point focal de la fenêtre ───
     Ce qui est dans Underpass en ce moment, c'est ce que le joueur va
     retrouver en jeu. Tout le reste (site, bibliothèque) sert à changer
     cette ligne-là. D'où sa place en haut, son titre en grand, et le filet
     bleu vers orange de l'application en dessous. */
  .slot {
    position:relative; flex:none; display:flex; align-items:center; gap:18px;
    padding:14px 20px 16px;
    background:linear-gradient(90deg, var(--panel2), var(--panel) 55%);
  }
  .slot::after {
    content:''; position:absolute; left:0; right:0; bottom:0; height:2px;
    background:linear-gradient(90deg, var(--blue) 0 34%, var(--orange) 66% 100%);
  }
  /* Plaque inclinée « Underpass » : même geste que le sigle RL de la barre
     de titre, pour dire « emplacement du jeu » d'un coup d'œil. */
  .slot-plate {
    flex:none; transform:skewX(var(--skew)); background:var(--blue-deep);
    border-left:4px solid var(--blue); padding:6px 14px 6px 12px;
  }
  .slot-plate > span {
    display:inline-block; transform:skewX(calc(var(--skew) * -1));
    font-family:var(--ui-font); font-style:italic; font-weight:800;
    font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:#fff;
  }
  .slot.warn .slot-plate { background:var(--orange-deep); border-left-color:var(--orange); }
  .slot-main { flex:1; min-width:0; }
  .slot-title {
    font-family:var(--ui-font); font-style:var(--num-style); font-weight:800;
    font-size:26px; line-height:1.1; letter-spacing:.02em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .slot-title.none { color:var(--muted); }
  .slot-sub { margin-top:3px; font-size:13px; color:var(--muted); line-height:1.45; }
  .slot-sub b { color:var(--text); font-weight:600; }
  .slot-actions { flex:none; display:flex; gap:8px; }

  /* ─── Boutons (mêmes familles que la fenêtre de contrôle) ─── */
  .btn {
    border:0; padding:10px 18px; min-height:40px; cursor:pointer; white-space:nowrap;
    font-family:var(--ui-font); font-style:italic; font-weight:800;
    font-size:15px; letter-spacing:.08em; text-transform:uppercase;
    color:#fff; background:var(--blue-deep);
  }
  /* Survol : un liseré d'accent en bas, le fond ne change pas. Passer au
     bleu vif faisait tomber le texte blanc à 2,5:1. */
  .btn:hover { box-shadow:inset 0 -3px 0 var(--blue); }
  .btn:disabled { opacity:.55; cursor:progress; }
  .ghost {
    border:1px solid var(--line); background:var(--panel); color:var(--text);
    padding:9px 14px; min-height:40px; font-size:12.5px; font-weight:600;
    font-family:inherit; cursor:pointer; text-transform:uppercase;
    letter-spacing:.06em; white-space:nowrap;
  }
  .ghost:hover { border-color:var(--blue); }
  .ghost:disabled { opacity:.55; cursor:default; }
  .ghost.danger:hover, .ghost.danger.armed { border-color:var(--orange); color:var(--orange); }

  /* ─── Onglets ─── */
  .tabs { flex:none; display:flex; gap:4px; padding:10px 20px 0;
    border-bottom:1px solid var(--line); }
  .tab {
    border:0; background:transparent; color:var(--muted); cursor:pointer;
    padding:10px 16px 11px; min-height:44px; border-bottom:3px solid transparent;
    font-family:var(--ui-font); font-weight:700; font-size:16px;
    letter-spacing:.08em; text-transform:uppercase;
  }
  .tab:hover { color:var(--text); }
  .tab[aria-selected="true"] { color:var(--text); border-bottom-color:var(--blue); }
  .tab .n { color:var(--muted); font-weight:700; margin-left:4px; }

  .pane { flex:1; min-height:0; display:none; flex-direction:column; }
  .pane.on { display:flex; }

  /* ─── Parcourir ─── */
  .bar { flex:none; display:flex; align-items:center; gap:6px; padding:8px 12px;
    background:var(--panel); border-bottom:1px solid var(--line); }
  .ico {
    width:40px; height:40px; flex:none; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); cursor:pointer; font-size:17px;
    line-height:1; font-family:'Segoe UI Symbol','Segoe UI',sans-serif;
  }
  .ico:hover { border-color:var(--blue); }
  .ico:disabled { opacity:.4; cursor:default; border-color:var(--line); }
  .addr { flex:1; min-width:0; padding:0 10px; font-size:13px; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .addr b { color:var(--text); font-weight:600; }
  .addr .loading { color:var(--blue); }
  /* Zone réservée au site : la vue intégrée se pose exactement dessus. Ce
     qui est écrit ici ne se voit que quand elle est retirée (chargement
     initial, panne réseau). */
  .view-area { flex:1; min-height:0; position:relative; background:var(--panel); }
  .view-msg { position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; padding:24px;
    text-align:center; font-size:14px; color:var(--muted); line-height:1.5; }
  .view-msg b { color:var(--text); }

  /* Téléchargements : une ligne par fichier, sous le site, pour que la
     fiche reste visible pendant que la carte arrive. */
  .dl { flex:none; max-height:40%; overflow-y:auto; background:var(--panel);
    border-top:1px solid var(--line); }
  .dl:empty { display:none; }
  .dl-row { display:flex; align-items:center; gap:12px; padding:9px 14px;
    border-bottom:1px solid var(--line); font-size:13px; }
  .dl-name { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dl-name b { font-weight:600; }
  .dl-state { color:var(--muted); white-space:nowrap; }
  .dl-row.ok .dl-state { color:var(--blue); }
  .dl-row.bad .dl-state { color:var(--orange); }
  .prog { width:140px; height:6px; background:var(--bg); flex:none; }
  .prog > i { display:block; height:100%; background:var(--blue); width:0; }
  .dl-row .ghost, .dl-row .btn { min-height:34px; padding:6px 12px; }
  .x { width:34px; height:34px; border:0; background:transparent; color:var(--muted);
    cursor:pointer; font-size:15px; flex:none; }
  .x:hover { color:var(--text); }

  /* ─── Bibliothèque ─── */
  .lib { flex:1; min-height:0; overflow-y:auto; padding:18px 20px 26px; position:relative; }
  .lib::-webkit-scrollbar { width:8px; }
  .lib::-webkit-scrollbar-thumb { background:var(--line); }
  .lib-head { display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .lib-head .count { flex:1; font-size:13px; color:var(--muted); min-width:180px; }
  .lib-head .hint { flex-basis:100%; font-size:12px; color:var(--muted); line-height:1.5; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:16px; }

  /* Tuile : la plaque chanfreinée de l'application, aperçu en tête. Celle
     qui occupe Underpass prend l'accent bleu : c'est l'information qu'on
     cherche en ouvrant la bibliothèque. */
  .card {
    position:relative; display:flex; flex-direction:column; min-width:0;
    background:linear-gradient(168deg, var(--panel2), var(--panel) 42%);
    border:1px solid var(--line);
    clip-path:polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%,
      calc(var(--cut) - 4px) 100%, 0 calc(100% - var(--cut) + 4px));
    box-shadow:inset 0 -3px 0 var(--edge);
  }
  .card.on { border-color:var(--blue); }
  .card.on::after {
    content:''; position:absolute; top:0; right:0; width:16px; height:16px;
    background:var(--blue); pointer-events:none;
  }
  .thumb { aspect-ratio:16 / 9; background:var(--bg); position:relative; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  /* Pas d'aperçu : un emplacement neutre qui le dit, jamais une image inventée. */
  .thumb .noimg { position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; font-size:12px; color:var(--muted);
    letter-spacing:.06em; text-transform:uppercase; }
  /* Pastille d'état réelle (la carte EST dans Underpass), pas une décoration. */
  .here {
    position:absolute; left:10px; top:10px; transform:skewX(var(--skew));
    background:var(--blue-deep); padding:3px 10px;
  }
  .here > span { display:inline-block; transform:skewX(calc(var(--skew) * -1));
    font-family:var(--ui-font); font-style:italic; font-weight:800; font-size:13px;
    letter-spacing:.1em; text-transform:uppercase; color:#fff; }
  .body { padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .name { font-family:var(--ui-font); font-style:var(--num-style); font-weight:800;
    font-size:20px; line-height:1.15; overflow-wrap:anywhere; }
  .meta { font-size:12px; color:var(--muted); line-height:1.45; overflow-wrap:anywhere; }
  .meta.bad { color:var(--red); }
  .acts { display:flex; gap:8px; margin-top:auto; padding-top:8px; flex-wrap:wrap; }
  .acts .btn { flex:1 1 100%; }
  .acts .ghost { flex:1 1 auto; }

  .empty { max-width:560px; margin:40px auto 0; text-align:center;
    font-size:14px; color:var(--muted); line-height:1.6; }
  .empty h2 { font-family:var(--ui-font); font-style:italic; font-weight:800;
    font-size:24px; color:var(--text); letter-spacing:.03em; margin-bottom:8px; }
  .empty .row { display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap; }

  /* Dépôt de fichier : cadre pointillé sur toute la bibliothèque. */
  .drop { position:absolute; inset:10px; border:2px dashed var(--blue);
    background:color-mix(in srgb, var(--bg) 88%, transparent); display:none;
    align-items:center; justify-content:center; font-size:16px; font-weight:600;
    pointer-events:none; }
  .lib.dragging .drop { display:flex; }

  /* Message d'action : DANS le flux, sous les onglets, et non flottant. La
     vue du site est une couche native posée au-dessus de la page : un
     message flottant en bas passait dessous, invisible. Ici il pousse la vue
     vers le bas le temps d'être lu. */
  .toast { flex:none; display:none; align-items:center; gap:12px; flex-wrap:wrap;
    padding:9px 20px; font-size:13.5px; line-height:1.45;
    background:var(--panel2); border-bottom:1px solid var(--line);
    border-left:4px solid var(--blue); }
  .toast.on { display:flex; }
  .toast.bad { border-left-color:var(--orange); }
  .toast .ghost { min-height:34px; padding:6px 12px; }
  .toast .x { margin-left:auto; }

  @media (max-width:980px) {
    .slot { flex-wrap:wrap; }
    .slot-actions { width:100%; }
    .prog { width:90px; }
  }
  @media (prefers-reduced-motion:no-preference) {
    .prog > i { transition:width .2s linear; }
  }
</style>

<body>

  <header class="slot" id="slot">
    <div class="slot-plate"><span>Underpass</span></div>
    <div class="slot-main">
      <div class="slot-title none" id="slotTitle">&nbsp;</div>
      <div class="slot-sub" id="slotSub">&nbsp;</div>
    </div>
    <div class="slot-actions">
      <button class="ghost" id="restoreBtn" hidden></button>
    </div>
  </header>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" id="tabBrowse" aria-controls="paneBrowse" aria-selected="true" data-pane="browse"></button>
    <button class="tab" role="tab" id="tabLib" aria-controls="paneLib" aria-selected="false" data-pane="lib" tabindex="-1"></button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <section class="pane on" id="paneBrowse" role="tabpanel" aria-labelledby="tabBrowse">
    <div class="bar">
      <button class="ico" id="navBack" disabled>&#8592;</button>
      <button class="ico" id="navFwd" disabled>&#8594;</button>
      <button class="ico" id="navReload">&#8635;</button>
      <div class="addr" id="addr"></div>
      <button class="ghost" id="navHome"></button>
      <button class="ghost" id="navExt"></button>
    </div>
    <div class="view-area" id="viewArea">
      <div class="view-msg" id="viewMsg"></div>
    </div>
    <div class="dl" id="dl" aria-live="polite"></div>
  </section>

  <section class="pane" id="paneLib" role="tabpanel" aria-labelledby="tabLib">
    <div class="lib" id="lib">
      <div class="lib-head">
        <div class="count" id="libCount"></div>
        <button class="ghost" id="importBtn"></button>
        <p class="hint" id="eacHint"></p>
      </div>
      <div id="libBody"></div>
      <div class="drop" id="drop"></div>
    </div>
  </section>

      return Math.round(va + (vb - va) * f);
    });
    return '#' + c.map(function (v) { return v.toString(16).padStart(2, '0'); }).join('');
  }
  function isLight(hex) {
    var c = String(hex || '').replace('#', '');
    if (c.length !== 6) return false;
    var r = parseInt(c.slice(0, 2), 16) / 255, g = parseInt(c.slice(2, 4), 16) / 255,
      b = parseInt(c.slice(4, 6), 16) / 255;
    return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 0.55;
  }
  var themeKey = '';
  function applyLook(cfg) {
    var skin = SKIN_IDS.indexOf(cfg.skin) >= 0 ? cfg.skin : 'arena';
    var t = Object.assign({}, THEME_DEFAULT, cfg.theme || {});
    var key = skin + JSON.stringify(t);
    if (key === themeKey) return;
    themeKey = key;
    var d = document.documentElement;
    d.dataset.skin = skin;
    var s = d.style;
    s.setProperty('--blue', t.win);
    s.setProperty('--blue-deep', mix(t.win, '#000000', .42));
    s.setProperty('--orange', t.loss);
    s.setProperty('--orange-deep', mix(t.loss, '#000000', .35));
    s.setProperty('--gold', t.gold);
    s.setProperty('--bg', t.bg);
    var light = isLight(t.bg), toward = light ? '#000000' : '#ffffff';
    s.setProperty('--text', light ? '#12161c' : '#eef1f5');
    s.setProperty('--muted', light ? '#5b6472' : '#8b93a1');
    s.setProperty('--panel', mix(t.bg, toward, .055));
    s.setProperty('--panel2', mix(t.bg, toward, .10));
    s.setProperty('--line', mix(t.bg, toward, .22));
    // Le rouge d'erreur, clair sur fond sombre, tombait à 2,5:1 sur Papier.
    s.setProperty('--red', light ? '#b3162b' : '#ff4d5e');
  }

  // ─────────── Toast ───────────
  var toastTimer = null;
  // `action` : { label, run } — un bouton dans le message, pour les liens
  // extérieurs que le site voulait ouvrir.
  function toast(msg, bad, action) {
    var el = $('toast');
    var hide = function () { el.className = 'toast'; syncView(); };
    el.textContent = '';
    var t = document.createElement('span');
    t.textContent = msg;
    el.appendChild(t);
    if (action) {
      var b = document.createElement('button');
      b.className = 'ghost';
      b.textContent = action.label;
      b.onclick = function () { action.run(); hide(); };
      el.appendChild(b);
    }
    var x = document.createElement('button');
    x.className = 'x';
    x.setAttribute('aria-label', T('close'));
    x.innerHTML = '&#10005;';
    x.onclick = hide;
    el.appendChild(x);
    el.className = 'toast on' + (bad ? ' bad' : '');
    syncView();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hide, action ? 12000 : bad ? 9000 : 5000);
  }

  // ─────────── Onglets ───────────
  var pane = 'browse';
  function showPane(p, focus) {
    pane = p;
    ['browse', 'lib'].forEach(function (k) {
      var tab = k === 'browse' ? $('tabBrowse') : $('tabLib');
      var on = k === p;
      tab.setAttribute('aria-selected', on ? 'true' : 'false');
      tab.tabIndex = on ? 0 : -1;
      (k === 'browse' ? $('paneBrowse') : $('paneLib')).classList.toggle('on', on);
      if (on && focus) tab.focus();
    });
    syncView();
  }
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.tab');
    if (b) showPane(b.dataset.pane);
  });
  // Flèches gauche/droite entre onglets, comme le veut le motif « tablist ».
  $('tabs').addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    showPane(pane === 'browse' ? 'lib' : 'browse', true);
  });

  // ─────────── Vue du site ───────────
  // La vue intégrée n'est pas un élément de la page : le processus principal
  // la pose sur le rectangle de #viewArea, qu'on lui renvoie à chaque
  // changement de taille. Retirée quand l'onglet change ou quand le site est
  // en panne, pour laisser voir le message.
  var navState = { url: '', loading: true, error: null, canBack: false, canForward: false };
  var viewShown = null;
  function syncView() {
    var show = pane === 'browse' && !navState.error;
    var r = null;
    if (show) {
      var b = $('viewArea').getBoundingClientRect();
      r = { x: b.left, y: b.top, width: b.width, height: b.height };
    }
    var key = JSON.stringify(r);
    if (key === viewShown) return;
    viewShown = key;
    rl.mapsViewBounds(r);
  }
  new ResizeObserver(syncView).observe($('viewArea'));
  window.addEventListener('resize', syncView);

  function renderNav() {
    $('navBack').disabled = !navState.canBack;
    $('navFwd').disabled = !navState.canForward;
    var u = null;
    try { u = new URL(navState.url); } catch (e) { u = null; }
    var where = u ? '<b>' + esc(u.hostname) + '</b>' + esc(u.pathname + u.search) : '';
    $('addr').innerHTML = where + (navState.loading ? ' <span class="loading">' + esc(T('loading')) + '</span>' : '');
    var msg = $('viewMsg');
    if (navState.error) {
      msg.innerHTML = '<div><b>' + esc(T('siteError')) + '</b><br>' + esc(T('siteErrorHint'))
        + '<br><small>(' + esc(navState.error) + ')</small></div>'
        + '<button class="btn" id="retryBtn">' + esc(T('retry')) + '</button>';
      $('retryBtn').onclick = function () {
        navState.error = null;
        renderNav();
        syncView();
        rl.mapsView('reload');
      };
    } else {
      msg.textContent = T('loadingSite');
    }
    syncView();
  }
  var lastBlocked = { host: '', at: 0 };
  rl.onMapsNav(function (n) {
    if (!n) return;
    if (n.blocked) {
      // Un lien vers un autre site : proposé, jamais ouvert d'office. Un même
      // site qui insiste (pub) ne produit qu'un message toutes les 20 s.
      var host = '';
      try { host = new URL(n.blocked).hostname; } catch (e) { return; }
      var now = Date.now();
      if (host === lastBlocked.host && now - lastBlocked.at < 20000) return;
      lastBlocked = { host: host, at: now };
      toast(T('blocked', { h: host }), false, { label: T('openIt'), run: function () {
        rl.mapsView('open-blocked:' + n.blocked);
      } });
      return;
    }
    Object.assign(navState, n);
    renderNav();
  });
  $('navBack').onclick = function () { rl.mapsView('back'); };
  $('navFwd').onclick = function () { rl.mapsView('forward'); };
  $('navReload').onclick = function () { navState.error = null; renderNav(); rl.mapsView('reload'); };
  $('navHome').onclick = function () { navState.error = null; renderNav(); rl.mapsView('home'); };
  $('navExt').onclick = function () { rl.mapsView('external'); };

  // ─────────── Téléchargements ───────────
  var dls = {};   // id -> { name, state, received, total, mapId, title, error }
  function fmtSize(n) {
    if (!(n > 0)) return '';
    var mb = n / (1024 * 1024);
    var v = mb >= 10 ? Math.round(mb) : Math.round(mb * 10) / 10;
    return v.toLocaleString(lang === 'en' ? 'en-US' : 'fr-FR') + (lang === 'en' ? ' MB' : ' Mo');
  }
  function renderDownloads() {
    var ids = Object.keys(dls).sort(function (a, b) { return b - a; });
    $('dl').innerHTML = ids.map(function (id) {
      var d = dls[id];
      var cls = 'dl-row', st = '', extra = '';
      if (d.state === 'progress') {
        var pct = d.total > 0 ? Math.min(100, Math.round(d.received * 100 / d.total)) : 0;
        st = d.total > 0 ? pct + ' %' : fmtSize(d.received);
        extra = '<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'
          + pct + '"><i style="width:' + pct + '%"></i></div>';
        if (d.total > 0 && d.received >= d.total) st = T('dlImporting');
      } else if (d.state === 'imported') {
        cls += ' ok';
        st = d.duplicate ? T('dlDuplicate') : T('dlImported');
        extra = '<button class="btn" data-load="' + esc(d.mapId) + '">' + esc(T('load')) + '</button>';
      } else {
        cls += ' bad';
        st = d.state === 'refused' ? T('dlRefused') : d.state === 'cancelled' ? T('dlCancelled')
          : d.state === 'error' ? (d.error || T('dlFailed')) : T('dlFailed');
      }
      var done = d.state !== 'progress';
      return '<div class="' + cls + '"><div class="dl-name"><b>' + esc(d.title || d.name) + '</b></div>'
        + '<div class="dl-state">' + esc(st) + '</div>' + extra
        + (done ? '<button class="x" data-dismiss="' + esc(id) + '" aria-label="OK">&#10005;</button>' : '')
        + '</div>';
    }).join('');
    syncView();
  }
  $('dl').addEventListener('click', function (e) {
    var l = e.target.closest('[data-load]');
    if (l) { loadMap(l.dataset.load, l); return; }
    var x = e.target.closest('[data-dismiss]');
    if (x) { delete dls[x.dataset.dismiss]; renderDownloads(); }
  });
  rl.onMapsDownload(function (d) {
    if (!d || d.id == null) return;
    dls[d.id] = Object.assign(dls[d.id] || {}, d);
    renderDownloads();
  });

  // ─────────── Bibliothèque ───────────
  var data = null, gameRunning = false, busy = false;
  var previews = {};   // id -> data: URL (ou '' si aucune)

  function renderSlot() {
    var slot = data && data.slot;
    var el = $('slot'), title = $('slotTitle'), sub = $('slotSub'), btn = $('restoreBtn');
    el.classList.remove('warn');
    btn.hidden = true;
    if (data && !data.installs.length) {
      title.className = 'slot-title none';
      title.textContent = T('slotNone');
      sub.textContent = T('noInstall');
      return;
    }
    if (slot && slot.loaded) {
      title.className = 'slot-title';
      title.textContent = slot.loaded.title;
      sub.innerHTML = gameRunning ? T('slotLoadedRun') : T('slotLoadedSub');
      btn.hidden = false;
      btn.textContent = T('restore');
      btn.onclick = function () { restore(btn); };
    } else if (slot && slot.reverted) {
      el.classList.add('warn');
      title.className = 'slot-title';
      title.textContent = T('slotReverted');
      sub.textContent = T('slotRevertedSub', { t: slot.reverted.title });
      if (data.maps.some(function (m) { return m.id === slot.reverted.id; })) {
        btn.hidden = false;
        btn.textContent = T('reload2', { t: slot.reverted.title });
        btn.onclick = function () { loadMap(slot.reverted.id, btn); };
      }
    } else {
      title.className = 'slot-title none';
      title.textContent = T('slotNone');
      sub.textContent = T('slotNoneSub');
    }
  }

  function renderLib() {
    var body = $('libBody');
    if (!data) { body.innerHTML = '<div class="empty">' + esc(T('libLoading')) + '</div>'; return; }
    var n = data.maps.length;
    $('tabLib').innerHTML = esc(T('tabLib')) + (n ? '<span class="n">' + n + '</span>' : '');
    $('libCount').textContent = n === 0 ? T('count0') : n === 1 ? T('count1') : T('countN', { n: n });
    if (!n) {
      body.innerHTML = '<div class="empty"><h2>' + esc(T('emptyTitle')) + '</h2>' + esc(T('emptyText'))
        + '<div class="row"><button class="btn" id="emptyBrowse">' + esc(T('emptyBrowse')) + '</button>'
        + '<button class="ghost" id="emptyImport">' + esc(T('importBtn')) + '</button></div></div>';
      $('emptyBrowse').onclick = function () { showPane('browse', true); };
      $('emptyImport').onclick = importFiles;
      return;
    }
    body.innerHTML = '<div class="grid">' + data.maps.map(function (m) {
      var meta = [];
      if (m.author) meta.push(T('by', { a: m.author }));
      if (m.size) meta.push(fmtSize(m.size));
      meta.push(m.source === 'bakkesplugins' ? T('srcBp') : T('srcFile'));
      var img = previews[m.id]
        ? '<img alt="" src="' + esc(previews[m.id]) + '">'
        : '<div class="noimg">' + esc(m.hasPreview ? '' : T('noPreview')) + '</div>';
      return '<article class="card' + (m.loaded ? ' on' : '') + '" data-id="' + esc(m.id) + '">'
        + '<div class="thumb">' + img
        + (m.loaded ? '<div class="here"><span>' + esc(T('loaded')) + '</span></div>' : '') + '</div>'
        + '<div class="body"><div class="name">' + esc(m.title) + '</div>'
        + '<div class="meta">' + esc(meta.join(' · ')) + '</div>'
        + (m.missing ? '<div class="meta bad">' + esc(T('missing')) + '</div>' : '')
        + '<div class="acts">'
        + (m.loaded ? '' : '<button class="btn" data-act="load"' + (m.missing ? ' disabled' : '') + '>'
          + esc(T('load')) + '</button>')
        + (m.page ? '<button class="ghost" data-act="page">' + esc(T('page')) + '</button>' : '')
        + '<button class="ghost danger" data-act="remove">' + esc(T('remove')) + '</button>'
        + '</div></div></article>';
    }).join('') + '</div>';
    fetchPreviews();
  }

  // Aperçus demandés un par un, puis gardés : la liste se redessine souvent
  // (chaque changement d'état), les images ne se relisent qu'une fois.
  function fetchPreviews() {
    data.maps.forEach(function (m) {
      if (!m.hasPreview || previews[m.id] !== undefined) return;
      previews[m.id] = '';
      rl.mapsPreview(m.id).then(function (url) {
        if (!url) return;
        previews[m.id] = url;
        var card = document.querySelector('.card[data-id="' + m.id + '"] .thumb');
        if (card) {
          var old = card.querySelector('.noimg');
          var img = document.createElement('img');
          img.alt = '';
          img.src = url;
          if (old) old.replaceWith(img); else card.prepend(img);
        }
      });
    });
  }

  function refresh() {
    return rl.mapsList().then(function (d) {
      data = d;
      gameRunning = !!d.gameRunning;
      renderSlot();
      renderLib();
    }).catch(function (e) {
      $('libBody').innerHTML = '<div class="empty">' + esc(T('libError', { e: e && e.message })) + '</div>';
    });
  }

  function report(r, okMsg) {
    if (r && r.ok) { if (okMsg) toast(okMsg); }
    else if (r && !r.canceled) toast(T('errPrefix') + (r.error || '?'), true);
  }

  function withBusy(btn, label, p) {
    busy = true;
    var old = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; if (label) btn.textContent = label; }
    return p.finally(function () {
      busy = false;
      if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = old; }
    });
  }

  function loadMap(id, btn) {
    if (busy) return;
    var m = data && data.maps.find(function (x) { return x.id === id; });
    withBusy(btn, T('loadingMap'), rl.mapsLoad(id).then(function (r) {
      report(r, T('toastLoaded', { t: m ? m.title : '' }));
      return refresh();
    }));
  }
  function restore(btn) {
    if (busy) return;
    withBusy(btn, null, rl.mapsRestore().then(function (r) {
      report(r, T('toastRestored'));
      return refresh();
    }));
  }
  // Suppression en deux temps, sans boîte de dialogue : le bouton passe en
  // « Confirmer » quatre secondes. Une fenêtre modale bloquerait la vue du site.
  function removeMap(id, btn) {
    if (busy) return;
    if (!btn.classList.contains('armed')) {
      btn.classList.add('armed');
      btn.textContent = T('confirm');
      setTimeout(function () {
        if (btn.isConnected) { btn.classList.remove('armed'); btn.textContent = T('remove'); }
      }, 4000);
      return;
    }
    withBusy(btn, null, rl.mapsRemove(id).then(function (r) {
      report(r, T('toastRemoved'));
      delete previews[id];
      return refresh();
    }));
  }
  $('libBody').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var id = b.closest('.card').dataset.id;
    var act = b.dataset.act;
    if (act === 'load') loadMap(id, b);
    else if (act === 'remove') removeMap(id, b);
    else if (act === 'page') {
      var m = data.maps.find(function (x) { return x.id === id; });
      if (m && m.page) {
        navState.error = null;
        showPane('browse');
        rl.mapsView('goto:' + m.page);
      }
    }
  });

  function importResult(r) {
    var res = (r && r.results) || [];
    var ok = res.filter(function (x) { return x.ok; }).length;
    var bad = res.filter(function (x) { return !x.ok; });
    if (bad.length) toast(T('errPrefix') + bad[0].error, true);
    else if (ok) toast(T('toastImported', { n: ok }));
    return refresh();
  }
  function importFiles() {
    if (busy) return;
    withBusy($('importBtn'), null, rl.mapsImport().then(importResult));
  }
  $('importBtn').onclick = importFiles;

  // Glisser un .udk / .zip dans la bibliothèque (le site, lui, reçoit ses
  // propres dépôts : la vue intégrée est au-dessus de la page).
  var lib = $('lib'), dragDepth = 0;
  lib.addEventListener('dragenter', function (e) { e.preventDefault(); dragDepth++; lib.classList.add('dragging'); });
  lib.addEventListener('dragover', function (e) { e.preventDefault(); });
  lib.addEventListener('dragleave', function () { if (--dragDepth <= 0) { dragDepth = 0; lib.classList.remove('dragging'); } });
  lib.addEventListener('drop', function (e) {
    e.preventDefault();
    dragDepth = 0;
    lib.classList.remove('dragging');
    var files = e.dataTransfer && e.dataTransfer.files;
    if (!files || !files.length || busy) return;
    withBusy(null, null, rl.mapsImportFiles(Array.from(files)).then(importResult));
  });

  rl.onMapsChanged(function (c) {
    if (c && c.guard) {
      if (c.guard.restored) toast(T('toastGuard'));
      else if (c.guard.error) toast(T('toastGuardFail', { e: c.guard.error }), true);
    }
    refresh();
  });

  // ─────────── Textes statiques ───────────
  function renderStatic() {
    document.documentElement.lang = lang;
    document.title = lang === 'en' ? 'Workshop maps' : 'Cartes workshop';
    $('tabBrowse').textContent = T('tabBrowse');
    $('tabLib').textContent = T('tabLib');
    var bk = [['navBack', 'back'], ['navFwd', 'fwd'], ['navReload', 'reload']];
    bk.forEach(function (p) { $(p[0]).title = T(p[1]); $(p[0]).setAttribute('aria-label', T(p[1])); });
    $('navHome').textContent = T('home');
    $('navExt').textContent = T('ext');
    $('importBtn').textContent = T('importBtn');
    $('eacHint').textContent = T('eac');
    $('drop').textContent = T('drop');
    renderNav();
    renderDownloads();
    renderSlot();
    renderLib();
  }

  function onState(s) {
    if (!s) return;
    applyLook(s.config || {});
    var l = s.lang === 'en' ? 'en' : 'fr';
    var run = !!(s.game && s.game.processRunning);
    if (l !== lang) { lang = l; renderStatic(); }
    if (run !== gameRunning) { gameRunning = run; renderSlot(); }
  }
  rl.onState(onState);
  renderStatic();
  rl.getState().then(onState).catch(function () {});
  refresh();
})();
</script>
</body>
</html>
