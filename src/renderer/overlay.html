<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'" />
<title>RL Session Tracker – Overlay</title>
<style>
  @font-face { font-family:'Barlow Condensed'; font-weight:700; font-style:normal;
    src:url('fonts/barlow-condensed-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family:'Barlow Condensed'; font-weight:800; font-style:normal;
    src:url('fonts/barlow-condensed-latin-800-normal.woff2') format('woff2'); }
  @font-face { font-family:'Barlow Condensed'; font-weight:800; font-style:italic;
    src:url('fonts/barlow-condensed-latin-800-italic.woff2') format('woff2'); }
  :root {
    --bg:#0c0e11; --panel2:#1a1e25; --line:#272d37;
    --text:#eef1f5; --muted:#8b93a1;
    --blue:#2f9bff; --orange:#ff8a1e;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--text); overflow:hidden;
    font-family:'Barlow Condensed','Segoe UI',sans-serif;
    -webkit-user-select:none; user-select:none;
    border:1px solid var(--line);
    display:flex; flex-direction:column;
    -webkit-app-region:drag;            /* tout le bandeau se déplace */
  }
  .strip { height:3px; background:linear-gradient(90deg,
    var(--blue) 0 50%, var(--orange) 50% 100%); flex:none; }
  .row { flex:1; display:flex; align-items:center; gap:12px; padding:0 14px; }
  .wl { display:flex; align-items:baseline; gap:7px;
    font-variant-numeric:tabular-nums; }
  .wl .w { font-size:42px; font-weight:800; color:var(--blue); line-height:1; }
  .wl .sep { font-size:22px; color:var(--line); }
  .wl .l { font-size:42px; font-weight:800; color:var(--orange); line-height:1; }
  .info { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .info .top { font-style:italic; font-weight:800; font-size:13px;
    letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .info .top.hot { color:var(--blue); }
  .info .top.tilt { color:var(--orange); }
  .info .bottom { font-weight:700; font-size:15px; color:var(--text);
    font-variant-numeric:tabular-nums; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; }
  .h2h { color:var(--muted); font-size:13px; font-weight:700; }
  .live-dot { display:inline-block; width:7px; height:7px;
    background:var(--blue); margin-right:6px; vertical-align:1px; }
</style>
</head>
<body>
  <div class="strip"></div>
  <div class="row">
    <div class="wl">
      <span class="w" id="w">0</span><span class="sep">–</span>
      <span class="l" id="l">0</span>
    </div>
    <div class="info">
      <div class="top" id="top">Session</div>
      <div class="bottom" id="bottom">–</div>
    </div>
  </div>
<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  var api = window.rl || {};

  // ─── Thème (partagé avec le dashboard) ───
  var THEME_DEFAULT = { win: '#2f9bff', loss: '#ff8a1e', bg: '#0c0e11', gold: '#ffc233' };
  function mix(a, b, f) {
    var pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    var c = [16, 8, 0].map(function (sh) {
      var va = (pa >> sh) & 255, vb = (pb >> sh) & 255;
      return Math.round(va + (vb - va) * f);
    });
    return '#' + c.map(function (v) { return v.toString(16).padStart(2, '0'); }).join('');
  }
  var themeApplied = '';
  function applyTheme(t) {
    t = Object.assign({}, THEME_DEFAULT, t || {});
    var key = JSON.stringify(t);
    if (key === themeApplied) return;
    themeApplied = key;
    var s = document.documentElement.style;
    s.setProperty('--blue', t.win);
    s.setProperty('--orange', t.loss);
    s.setProperty('--bg', t.bg);
    s.setProperty('--panel2', mix(t.bg, '#ffffff', .07));
    s.setProperty('--line', mix(t.bg, '#ffffff', .14));
  }

  var I18N = {
    fr: { session: 'Session', last: 'Dernier : ', wr: ' % V',
      streak: function (n, w) { return 'Série de ' + n + (w ? ' victoires' : ' défaites'); },
      h2h: function (w, l) { return w + 'V–' + l + 'D'; } },
    en: { session: 'Session', last: 'Last: ', wr: '% W',
      streak: function (n, w) { return 'Streak of ' + n + (w ? ' wins' : ' losses'); },
      h2h: function (w, l) { return w + 'W–' + l + 'L'; } },
  };
  var T = I18N.fr;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render(s) {
    if (!s) return;
    T = I18N[s.lang] || I18N.fr;
    var cfg = s.config || {};
    applyTheme(cfg.theme);
    var oc = cfg.overlayCfg || {};
    // La fenêtre est redimensionnée par le processus principal ; le contenu
    // suit via le zoom.
    document.body.style.zoom = oc.scale || 1;
    var ses = s.session || {};
    $('w').textContent = ses.wins || 0;
    $('l').textContent = ses.losses || 0;

    // Contenu personnalisable : série et/ou ligne live masquables.
    $('top').style.display = oc.showStreak === false ? 'none' : 'block';
    $('bottom').style.display = oc.showLive === false ? 'none' : 'block';

    var st = ses.streak || { count: 0 };
    var top = $('top');
    if (st.count >= 2) {
      top.className = 'top ' + (st.type === 'W' ? 'hot' : 'tilt');
      top.textContent = T.streak(st.count, st.type === 'W');
    } else {
      top.className = 'top';
      top.textContent = T.session + (ses.winrate != null
        ? ' — ' + ses.winrate + T.wr : '');
    }

    var live = s.live;
    if (live && !live.training && live.score) {
      // « Déjà croisé » : en 1v1 (un seul adversaire connu), son bilan.
      // h2h ne contient QUE les adversaires déjà croisés (pas tous les
      // adversaires du match) : en 2v2/3v3, un seul nom dans h2h ne veut
      // PAS dire un seul adversaire dans le match — il faut vérifier le
      // VRAI 1v1 via le nombre de joueurs, sinon on affiche « vs X »
      // comme un duel alors que X n'est qu'un des adversaires.
      var isDuel = Array.isArray(live.players) && live.players.length === 2;
      var h2h = '';
      var names = (isDuel && s.h2h) ? Object.keys(s.h2h) : [];
      if (names.length === 1) {
        var h = s.h2h[names[0]];
        h2h = '  <span class="h2h">vs ' + esc(names[0]) + ' · '
          + T.h2h(h.wins, h.losses) + '</span>';
      }
      $('bottom').innerHTML = '<span class="live-dot"></span>'
        + (live.mode ? live.mode + '  ' : '')
        + live.score[0] + ' : ' + live.score[1] + h2h;
    } else {
      var last = s.history && s.history[0];
      $('bottom').textContent = last && last.score
        ? T.last + last.score[0] + ' – ' + last.score[1]
          + (last.result === 'W' ? '  V' : last.result === 'L' ? '  D' : '')
        : '–';
    }
  }

  if (api.onState) api.onState(render);
  if (api.getState) api.getState().then(render);
})();
</script>
</body>
</html>
