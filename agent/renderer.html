<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
<title>RL Session Tracker</title>
<style>
  :root {
    --bg:#0a0c12; --card:#11141d; --card2:#161a26; --line:#232838;
    --text:#e7e9f0; --muted:#8b90a3; --cyan:#00e5ff; --pink:#ff3d71;
    --ok:#2ee6a6; --warn:#ffb020; --err:#ff5d6c;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:
      radial-gradient(640px 360px at 88% -10%, rgba(0,229,255,.12), transparent),
      radial-gradient(520px 340px at -8% 110%, rgba(255,61,113,.12), transparent),
      var(--bg);
    color:var(--text);
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none; user-select:none;
    overflow:hidden;
  }

  /* ─── Barre de titre sur mesure (fenêtre sans cadre) ─── */
  .titlebar {
    height:40px; display:flex; align-items:center; justify-content:space-between;
    padding-left:14px; -webkit-app-region:drag;
    border-bottom:1px solid var(--line);
  }
  .tb-title {
    font-size:12.5px; font-weight:700; letter-spacing:.02em; color:var(--text);
  }
  .tb-title .dotmark { color:var(--cyan); }
  .tb-buttons { display:flex; -webkit-app-region:no-drag; }
  .tb-btn {
    width:44px; height:40px; border:0; background:transparent; cursor:pointer;
    color:var(--muted); font-size:14px; font-family:inherit;
  }
  .tb-btn:hover { background:rgba(255,255,255,.06); color:var(--text); }
  .tb-btn.close:hover { background:#e3344b; color:#fff; }

  /* ─── Corps ─── */
  .body { height:calc(100vh - 40px); padding:24px; display:flex; flex-direction:column; }
  .view { display:none; flex:1; flex-direction:column; }
  body.phase-loading     .view-loading,
  body.phase-need-code   .view-need-code,
  body.phase-configuring .view-configuring,
  body.phase-running     .view-running { display:flex; }

  .view-loading, .view-configuring { align-items:center; justify-content:center; gap:18px; }
  .view-loading p, .view-configuring p {
    color:var(--muted); font-size:13.5px; text-align:center; line-height:1.5;
  }
  .spinner {
    width:34px; height:34px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--cyan);
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ─── Saisie du code ─── */
  .view-need-code { justify-content:center; }
  h1 { font-size:21px; margin-bottom:4px; }
  .sub { color:var(--muted); font-size:13.5px; margin-bottom:18px; line-height:1.5; }
  input {
    width:100%; background:var(--card2); border:1px solid var(--line);
    border-radius:10px; color:var(--text); font-size:17px; padding:13px;
    font-family:ui-monospace,Consolas,monospace; text-align:center;
    letter-spacing:.07em;
  }
  input:focus { outline:none; border-color:var(--cyan);
    box-shadow:0 0 0 3px rgba(0,229,255,.14); }
  button.primary {
    width:100%; margin-top:12px; border:0; border-radius:11px; padding:13px;
    font-size:14.5px; font-weight:700; font-family:inherit; cursor:pointer;
    color:#06121a; background:linear-gradient(90deg,var(--cyan),#51f0ff);
  }
  button.primary:disabled { opacity:.55; cursor:progress; }
  button.ghost {
    width:100%; border:1px solid var(--line); background:var(--card2);
    color:var(--text); border-radius:11px; padding:12px; font-size:14px;
    font-weight:600; font-family:inherit; cursor:pointer;
  }
  button.ghost:hover { border-color:var(--cyan); }
  .err { color:var(--err); font-size:13px; margin-top:11px; min-height:18px;
    text-align:center; }

  /* ─── Vue principale ─── */
  .status { display:flex; align-items:center; gap:11px;
    margin:6px 0 18px; font-size:18px; font-weight:600; }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--muted); flex:none; }
  .dot.ok   { background:var(--ok);   box-shadow:0 0 12px rgba(46,230,166,.7); }
  .dot.warn { background:var(--warn); box-shadow:0 0 12px rgba(255,176,32,.55); }
  .rows {
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:2px 16px;
  }
  .row { display:flex; justify-content:space-between; align-items:center;
    padding:13px 0; font-size:14px; }
  .row + .row { border-top:1px solid var(--line); }
  .row span { color:var(--muted); }
  .row b { font-weight:600; }
  .row b.live { color:var(--cyan); }
  .spacer { flex:1; }
  .foot { color:var(--muted); font-size:11px; text-align:center; margin-top:13px; }
</style>
</head>
<body class="phase-loading">

  <div class="titlebar">
    <div class="tb-title"><span class="dotmark">●</span> RL Session Tracker</div>
    <div class="tb-buttons">
      <button class="tb-btn" id="min" title="Réduire">&#9472;</button>
      <button class="tb-btn close" id="close" title="Fermer">&#10005;</button>
    </div>
  </div>

  <div class="body">

    <section class="view view-loading">
      <div class="spinner"></div>
      <p>Démarrage de l'agent…</p>
    </section>

    <section class="view view-need-code">
      <h1>Connecter l'agent</h1>
      <p class="sub">Colle le code de configuration obtenu lors de ton inscription
        sur le dashboard.</p>
      <input id="code" placeholder="RLST-XXXXX-XXXXX" autocomplete="off" spellcheck="false" />
      <button class="primary" id="enrollBtn">Activer l'agent</button>
      <div class="err" id="enrollErr"></div>
    </section>

    <section class="view view-configuring">
      <div class="spinner"></div>
      <p id="configMsg">Configuration en cours…</p>
    </section>

    <section class="view view-running">
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">…</span>
      </div>
      <div class="rows">
        <div class="row"><span>Joueur</span><b id="player">—</b></div>
        <div class="row"><span>Rocket League</span><b id="game">—</b></div>
        <div class="row"><span>Serveur</span><b id="srv">—</b></div>
        <div class="row"><span id="matchLabel">Match</span><b id="match">—</b></div>
      </div>
      <div class="spacer"></div>
      <button class="ghost" id="dashBtn">Ouvrir mon dashboard</button>
      <div class="foot">Tu peux fermer cette fenêtre : l'agent reste actif dans la barre des tâches.</div>
    </section>

  </div>

<script>
(function () {
  'use strict';
  function $(id) { return document.getElementById(id); }
  var api = window.rlAgent || {};

  function render(s) {
    if (!s) return;
    document.body.className = 'phase-' + (s.phase || 'loading');

    if (s.phase === 'need-code') {
      $('enrollErr').textContent = s.enrollError || '';
    }
    if (s.phase === 'configuring') {
      $('configMsg').textContent = s.message || 'Configuration en cours…';
    }
    if (s.phase === 'running') {
      var srvOk = s.server && s.server.connected;
      var gameOk = s.game && s.game.connected;
      $('dot').className = 'dot ' + (srvOk ? 'ok' : 'warn');
      $('statusText').textContent = srvOk ? 'Agent actif' : 'Connexion au serveur…';
      $('player').textContent = s.player && s.player.name ? s.player.name : '—';
      $('game').textContent = gameOk ? 'détecté' : 'en attente';
      $('game').className = gameOk ? 'live' : '';
      $('srv').textContent = srvOk ? 'connecté' : (s.server ? s.server.label : '—');
      $('srv').className = srvOk ? 'live' : '';
      if (s.match) {
        $('matchLabel').textContent = 'Match en cours';
        $('match').textContent = s.match;
        $('match').className = 'live';
      } else {
        $('matchLabel').textContent = 'Dernier match';
        $('match').textContent = s.lastMatch || '—';
        $('match').className = '';
      }
      $('dashBtn').style.display = s.dashboardUrl ? 'block' : 'none';
    }
  }

  // Barre de titre.
  $('min').onclick = function () { if (api.minimize) api.minimize(); };
  $('close').onclick = function () { if (api.close) api.close(); };

  // Saisie du code.
  $('enrollBtn').onclick = function () {
    var code = $('code').value.trim();
    if (!code) { $('enrollErr').textContent = 'Saisis ton code.'; return; }
    var b = $('enrollBtn');
    b.disabled = true; b.textContent = 'Vérification…';
    $('enrollErr').textContent = '';
    Promise.resolve(api.enroll ? api.enroll(code) : { ok: false })
      .then(function (r) {
        if (!r || !r.ok) {
          $('enrollErr').textContent = (r && r.error) || 'Échec de la configuration.';
        }
      })
      .catch(function () { $('enrollErr').textContent = 'Erreur inattendue.'; })
      .then(function () { b.disabled = false; b.textContent = "Activer l'agent"; });
  };
  $('code').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('enrollBtn').click();
  });

  $('dashBtn').onclick = function () { if (api.openDashboard) api.openDashboard(); };

  // État live.
  if (api.onState) api.onState(render);
  if (api.getState) api.getState().then(render);
})();
</script>
</body>
</html>
