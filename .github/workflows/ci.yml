# ci.yml — Filet de sécurité : tests + vérification de syntaxe à chaque push.
#
# Rapide et gratuit (repo public) : pas de binaire Electron téléchargé, pas
# de build Windows — uniquement la logique (session, config) et la validité
# des scripts des fenêtres.
#
# Ces mêmes étapes de vérification sont DUPLIQUÉES dans release.yml : ci.yml
# ne bloque pas la publication (il tourne juste en parallèle sur le même
# push), donc release.yml ne peut pas se contenter de dépendre de ce job.
# La forme propre serait un workflow réutilisable (workflow_call) appelé par
# les deux fichiers, mais ça ajoute un 5ᵉ fichier de workflow — hors du
# périmètre de cette modification, volontairement limitée à ci.yml,
# release.yml, package.json et README.md. D'où la duplication assumée :
# si tu modifies une vérification ici, reporte le même changement dans
# release.yml (section « Vérifications avant publication »).

name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Syntaxe des processus principaux
        run: |
          for f in src/main/*.js src/preload.js; do node --check "$f"; done

      - name: Syntaxe des scripts des fenêtres
        run: |
          node -e '
            const fs = require("fs");
            const fichiers = [
              "src/renderer/control.html",
              "src/renderer/dashboard.html",
              "src/renderer/overlay.html",
              "src/renderer/alphaboost.html",
              "src/renderer/obs.html",
            ];
            // Global (drapeau g) et attributs optionnels dans <script ...> :
            // un second bloc inline ajouté plus tard, ou un <script defer>
            // ou <script type="module">, restent détectés ici. La regex
            // précédente, non globale et sans attributs, ne vérifiait que le
            // tout premier bloc <script> nu de chaque fichier.
            const reScript = /<script([^>]*)>([\s\S]*?)<\/script>/g;
            let echec = false;
            for (const f of fichiers) {
              const html = fs.readFileSync(f, "utf8");
              const blocs = [...html.matchAll(reScript)];
              let verifies = 0;
              blocs.forEach(([, attrs, code], i) => {
                if (/\bsrc\s*=/.test(attrs)) return; // script externe : aucun contenu inline à compiler
                if (code.trim() === "") return; // bloc vide
                try {
                  new Function(code);
                } catch (err) {
                  console.error(`${f} : erreur de syntaxe dans le bloc <script> #${i + 1} -> ${err.message}`);
                  echec = true;
                }
                verifies++;
              });
              if (verifies === 0) {
                console.error(`Aucun script inline trouvé dans ${f}`);
                echec = true;
                continue;
              }
              console.log(f, `OK (${verifies} bloc(s) vérifié(s))`);
            }
            if (echec) process.exit(1);
          '
