# release.yml — Construit l'installeur Windows et publie la release GitHub.
#
# Déclenché par un tag de version :
#
#   npm version minor          # met à jour package.json + crée le tag vX.Y.Z
#   git push --follow-tags
#
# electron-builder publie l'installeur NSIS + latest.yml sur la release ;
# c'est ce que les applications installées consultent pour se mettre à jour.

name: release

# Trois façons de publier (electron-builder crée la release vX.Y.Z à partir
# de la version du package.json) :
#   1. pousser un tag v*  (npm version minor && git push --follow-tags)
#   2. bouton « Run workflow » dans l'onglet Actions
#   3. pousser sur main un commit dont le message contient [release]
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Sur main, ne publie que si le commit le demande explicitement.
    if: >-
      startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tests avant publication
        run: node --test

      - run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
