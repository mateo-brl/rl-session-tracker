# electron-builder.yml — Empaquetage et publication de RL Session Tracker.
#
# Produit un installeur Windows NSIS « un clic » et publie sur GitHub Releases.
# C'est cette publication (latest.yml + .exe) que electron-updater consulte
# pour proposer les mises à jour automatiques dans l'application.
#
#   npm run dist      → installeur local dans dist/
#   npm run release   → build + publication GitHub (GH_TOKEN requis)
#
# La publication normale passe par le workflow .github/workflows/release.yml
# déclenché par un tag v*.

appId: com.rlsessiontracker.app
productName: RL Session Tracker

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  # L'application n'est pas signée : ne pas exiger une signature identique
  # entre la version installée et la mise à jour téléchargée.
  verifyUpdateCodeSignature: false

nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: RL-Session-Tracker-Setup-${version}.${ext}

publish:
  provider: github
  owner: mateo-brl
  repo: rl-session-tracker
  # Valeur par défaut pour `npm run release` (publication locale, hors CI) :
  # là, aucune étape suivante ne vient lever un brouillon, donc `release`
  # (publication directe) est le seul réglage qui rende la mise à jour
  # visible aux applications installées — un brouillon oublié en local ne
  # produirait aucune erreur, juste une release invisible pour tout le monde.
  #
  # En CI, .github/workflows/release.yml SURCHARGE cette valeur via la
  # variable d'environnement EP_DRAFT="true" (release créée en brouillon,
  # levée seulement une fois l'installeur ET latest.yml en ligne — voir le
  # commentaire de l'étape « Construction + publication » dans ce workflow).
  # Ce fichier dit donc « release » mais la CI publie en réalité en deux
  # temps : c'est intentionnel, ne pas essayer de « corriger » l'un des deux
  # sans l'autre.
  releaseType: release
